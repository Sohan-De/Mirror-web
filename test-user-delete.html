<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test User Delete</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .result { background: #f0f0f0; padding: 20px; margin: 20px 0; border-radius: 5px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .info { background: #e3f2fd; color: #1565c0; }
    </style>
</head>
<body>
    <h1>🧪 Test User Delete Functionality</h1>
    <p>This will help us debug why user deletion isn't working in the admin dashboard.</p>
    
    <button onclick="testUserDelete()">🧪 Test User Delete</button>
    <button onclick="checkRLSPolicies()">🔍 Check RLS Policies</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>
    
    <div id="results"></div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            resultsDiv.appendChild(resultDiv);
        }
        
        async function testUserDelete() {
            try {
                addResult('🧪 Starting user delete test...', 'info');
                
                // Step 1: Get a test user
                addResult('Step 1: Getting a test user...', 'info');
                const { data: users, error: userError } = await supabase
                    .from('profiles')
                    .select('*')
                    .limit(1);
                
                if (userError) {
                    addResult(`❌ Step 1 failed: ${userError.message}`, 'error');
                    return;
                }
                
                if (!users || users.length === 0) {
                    addResult('❌ No users found to test with', 'error');
                    return;
                }
                
                const testUser = users[0];
                addResult(`✅ Step 1: Got test user: ${testUser.first_name} ${testUser.last_name} (ID: ${testUser.id})`, 'success');
                
                // Step 2: Try to delete the user
                addResult('Step 2: Attempting to delete test user...', 'info');
                
                const { error: deleteError } = await supabase
                    .from('profiles')
                    .delete()
                    .eq('id', testUser.id);
                
                if (deleteError) {
                    addResult(`❌ Step 2 failed: ${deleteError.message}`, 'error');
                    addResult(`Error code: ${deleteError.code}`, 'error');
                    addResult(`Error details: ${JSON.stringify(deleteError, null, 2)}`, 'error');
                    return;
                }
                
                addResult('✅ Step 2: User deleted successfully!', 'success');
                
                // Step 3: Verify deletion
                addResult('Step 3: Verifying deletion...', 'info');
                const { data: verifyData, error: verifyError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', testUser.id);
                
                if (verifyError) {
                    addResult(`❌ Step 3 failed: ${verifyError.message}`, 'error');
                } else if (verifyData && verifyData.length > 0) {
                    addResult('❌ Step 3 failed: User still exists after deletion', 'error');
                } else {
                    addResult('✅ Step 3: User deletion verified successfully', 'success');
                }
                
                // Step 4: Recreate the user for testing
                addResult('Step 4: Recreating test user...', 'info');
                const { error: recreateError } = await supabase
                    .from('profiles')
                    .insert({
                        id: testUser.id,
                        first_name: testUser.first_name,
                        last_name: testUser.last_name,
                        email: testUser.email,
                        created_at: testUser.created_at,
                        updated_at: new Date().toISOString()
                    });
                
                if (recreateError) {
                    addResult(`❌ Step 4 failed: ${recreateError.message}`, 'error');
                } else {
                    addResult('✅ Step 4: Test user recreated successfully', 'success');
                }
                
                addResult('🎉 User delete test completed!', 'success');
                
            } catch (error) {
                addResult(`❌ Test failed: ${error.message}`, 'error');
                addResult(`Stack trace: ${error.stack}`, 'error');
            }
        }
        
        async function checkRLSPolicies() {
            try {
                addResult('🔍 Checking RLS policies for profiles table...', 'info');
                
                // Check if RLS is enabled
                const { data: rlsData, error: rlsError } = await supabase
                    .from('profiles')
                    .select('*')
                    .limit(1);
                
                if (rlsError) {
                    addResult(`❌ RLS check failed: ${rlsError.message}`, 'error');
                    addResult(`Error code: ${rlsError.code}`, 'error');
                    return;
                }
                
                addResult('✅ RLS check passed - can read from profiles table', 'success');
                
                // Try to get current user
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    addResult(`✅ Current user: ${user.email} (ID: ${user.id})`, 'success');
                } else {
                    addResult('⚠️ No authenticated user found', 'info');
                }
                
            } catch (error) {
                addResult(`❌ RLS check failed: ${error.message}`, 'error');
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-check on page load
        window.addEventListener('load', () => {
            addResult('Page loaded. Ready to test user deletion.', 'info');
        });
    </script>
</body>
</html>
