<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Status Check</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn {
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            border: none;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            font-size: 16px;
        }
        
        .result {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            display: none;
        }
        
        .status {
            text-align: center;
            font-size: 24px;
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
        }
        
        .status.admin {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
        }
        
        .status.not-admin {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
        }
        
        .loading {
            text-align: center;
            display: none;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00d4ff;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .fix-button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Status Check</h1>
        <button class="btn" id="check-btn">Check Admin Status</button>
        <div class="loading" id="loading">Checking admin status...</div>
        <div class="status" id="status"></div>
        <div class="result" id="result"></div>
        <button class="fix-button" id="fix-btn" style="display: none;">Fix Admin Status</button>
        <a href="index.html" class="back-link">Back to Home</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const checkBtn = document.getElementById('check-btn');
            const fixBtn = document.getElementById('fix-btn');
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            const result = document.getElementById('result');
            
            checkBtn.addEventListener('click', checkAdminStatus);
            fixBtn.addEventListener('click', fixAdminStatus);
            
            async function checkAdminStatus() {
                loading.style.display = 'block';
                status.style.display = 'none';
                result.style.display = 'none';
                fixBtn.style.display = 'none';
                
                try {
                    // Get current user
                    const { user, error: userError } = await getCurrentUser();
                    
                    if (userError || !user) {
                        throw new Error('Not logged in. Please log in first.');
                    }
                    
                    // Check admin status
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', user.id)
                        .single();
                    
                    if (error) throw error;
                    
                    // Display results
                    const isAdmin = data?.is_admin === true;
                    
                    status.textContent = isAdmin ? 'You ARE an admin! ✅' : 'You are NOT an admin ❌';
                    status.className = `status ${isAdmin ? 'admin' : 'not-admin'}`;
                    
                    result.textContent = JSON.stringify({
                        user_id: user.id,
                        email: user.email,
                        is_admin: data?.is_admin,
                        profile_data: data
                    }, null, 2);
                    
                    // Show fix button if not admin
                    if (!isAdmin) {
                        fixBtn.style.display = 'block';
                    }
                    
                } catch (error) {
                    status.textContent = `Error: ${error.message}`;
                    status.className = 'status not-admin';
                } finally {
                    loading.style.display = 'none';
                    status.style.display = 'block';
                    result.style.display = 'block';
                }
            }
            
            async function fixAdminStatus() {
                loading.style.display = 'block';
                status.textContent = 'Fixing admin status...';
                status.className = 'status';
                
                try {
                    // Get current user
                    const { user, error: userError } = await getCurrentUser();
                    
                    if (userError || !user) {
                        throw new Error('Not logged in. Please log in first.');
                    }
                    
                    // Update profile to set as admin
                    const { data, error } = await supabase
                        .from('profiles')
                        .update({ is_admin: true })
                        .eq('id', user.id);
                    
                    if (error) throw error;
                    
                    status.textContent = 'Admin status fixed! You are now an admin. ✅';
                    status.className = 'status admin';
                    
                    // Check again to verify
                    const { data: updatedData, error: checkError } = await supabase
                        .from('profiles')
                        .select('is_admin')
                        .eq('id', user.id)
                        .single();
                    
                    if (checkError) throw checkError;
                    
                    result.textContent = JSON.stringify({
                        user_id: user.id,
                        email: user.email,
                        is_admin: updatedData?.is_admin,
                        message: 'Admin status updated successfully'
                    }, null, 2);
                    
                    fixBtn.style.display = 'none';
                    
                } catch (error) {
                    status.textContent = `Error fixing admin status: ${error.message}`;
                    status.className = 'status not-admin';
                } finally {
                    loading.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
