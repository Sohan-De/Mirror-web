<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Table Structure</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .result { background: #f0f0f0; padding: 20px; margin: 20px 0; border-radius: 5px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>🔍 Test Table Structure</h1>
    <p>This page will help us understand your Key table structure.</p>
    
    <button onclick="checkTableStructure()">🔍 Check Key Table Structure</button>
    <button onclick="testKeyDelivery()">🧪 Test Key Delivery</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>
    
    <div id="results"></div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // Initialize Supabase (you'll need to add your credentials)
        const supabaseUrl = 'https://hyimlsdqexkbltlhjctp.supabase.co';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'; // Add your key here
        
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);
        
        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            resultsDiv.appendChild(resultDiv);
        }
        
        async function checkTableStructure() {
            try {
                addResult('🔍 Checking Key table structure...', 'info');
                
                // Try to get table info
                const { data, error } = await supabase
                    .from('Key')
                    .select('*')
                    .limit(1);
                
                if (error) {
                    addResult(`❌ Error accessing Key table: ${error.message}`, 'error');
                    addResult(`Error code: ${error.code}`, 'error');
                    return;
                }
                
                if (data && data.length > 0) {
                    const sampleRecord = data[0];
                    addResult('✅ Key table exists and has data!', 'success');
                    addResult(`📊 Sample record: ${JSON.stringify(sampleRecord, null, 2)}`, 'info');
                    addResult(`🔑 Available columns: ${Object.keys(sampleRecord).join(', ')}`, 'success');
                    
                    // Check specific columns
                    if (sampleRecord.id !== undefined) addResult('✅ ID column exists: ' + sampleRecord.id, 'success');
                    if (sampleRecord.key_id !== undefined) addResult('✅ KEY_ID column exists: ' + sampleRecord.key_id, 'success');
                    if (sampleRecord.key_value !== undefined) addResult('✅ KEY_VALUE column exists: ' + sampleRecord.key_value, 'success');
                    if (sampleRecord.used !== undefined) addResult('✅ USED column exists: ' + sampleRecord.used, 'success');
                    
                } else {
                    addResult('⚠️ Key table exists but no data found', 'info');
                }
                
                // Check for unused keys
                addResult('🔍 Checking for unused keys...', 'info');
                const { data: unusedKeys, error: unusedError } = await supabase
                    .from('Key')
                    .select('*')
                    .eq('used', false)
                    .limit(5);
                
                if (unusedError) {
                    addResult(`❌ Error checking unused keys: ${unusedError.message}`, 'error');
                } else {
                    addResult(`✅ Found ${unusedKeys.length} unused keys`, 'success');
                    if (unusedKeys.length > 0) {
                        addResult(`🔑 First unused key: ${JSON.stringify(unusedKeys[0], null, 2)}`, 'info');
                    }
                }
                
            } catch (error) {
                addResult(`❌ Unexpected error: ${error.message}`, 'error');
            }
        }
        
        async function testKeyDelivery() {
            try {
                addResult('🧪 Testing key delivery process...', 'info');
                
                // Step 1: Get unused key
                addResult('Step 1: Getting unused key...', 'info');
                const { data: keys, error: keyError } = await supabase
                    .from('Key')
                    .select('*')
                    .eq('used', false)
                    .limit(1)
                    .single();
                
                if (keyError) {
                    addResult(`❌ Step 1 failed: ${keyError.message}`, 'error');
                    return;
                }
                
                addResult(`✅ Step 1: Got key: ${JSON.stringify(keys, null, 2)}`, 'success');
                
                // Step 2: Test marking as used
                addResult('Step 2: Testing mark as used...', 'info');
                
                // Determine ID column
                let idColumn = 'id';
                if (keys.key_id !== undefined) idColumn = 'key_id';
                else if (keys.license_id !== undefined) idColumn = 'license_id';
                else if (keys.key_value !== undefined) idColumn = 'key_value';
                
                addResult(`Using column: ${idColumn} = ${keys[idColumn]}`, 'info');
                
                const { error: updateError } = await supabase
                    .from('Key')
                    .update({ used: true, updated_at: new Date().toISOString() })
                    .eq(idColumn, keys[idColumn]);
                
                if (updateError) {
                    addResult(`❌ Step 2 failed: ${updateError.message}`, 'error');
                    return;
                }
                
                addResult('✅ Step 2: Key marked as used successfully', 'success');
                
                // Step 3: Reset key back to unused
                addResult('Step 3: Resetting key to unused...', 'info');
                const { error: resetError } = await supabase
                    .from('Key')
                    .update({ used: false, updated_at: new Date().toISOString() })
                    .eq(idColumn, keys[idColumn]);
                
                if (resetError) {
                    addResult(`❌ Step 3 failed: ${resetError.message}`, 'error');
                } else {
                    addResult('✅ Step 3: Key reset to unused successfully', 'success');
                }
                
                addResult('🎉 All tests completed successfully!', 'success');
                
            } catch (error) {
                addResult(`❌ Test failed: ${error.message}`, 'error');
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-check on page load
        window.addEventListener('load', () => {
            addResult('Page loaded. Ready to test table structure.', 'info');
            addResult('⚠️ Make sure to add your Supabase anon key in the script!', 'error');
        });
    </script>
</body>
</html>
