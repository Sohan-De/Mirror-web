<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .card h2 {
            margin-top: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        table th, table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        table th {
            background: rgba(0, 0, 0, 0.2);
        }
        
        .btn {
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            border: none;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            margin-right: 10px;
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #ccc;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #ff4b2b;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .success {
            background: rgba(0, 255, 0, 0.1);
            border-left: 4px solid #00ff88;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-active {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }
        
        .status-inactive {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }
        
        #message {
            display: none;
            margin-bottom: 20px;
        }
        
        .admin-form {
            margin-top: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        
        .form-control {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Admin Dashboard</h1>
        
        <div id="message"></div>
        
        <div class="card">
            <h2>User Management</h2>
            <div id="users-table-container">
                <div class="loading">Loading users...</div>
            </div>
        </div>
        
        <div class="card">
            <h2>Make User Admin</h2>
            <div class="admin-form">
                <div class="form-group">
                    <label for="user-id">User ID</label>
                    <input type="text" id="user-id" class="form-control" placeholder="Enter user ID">
                </div>
                <button id="make-admin-btn" class="btn">Make Admin</button>
            </div>
        </div>
        
        <div class="card">
            <h2>Database Status</h2>
            <div id="db-status">
                <div class="loading">Checking database status...</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Supabase client
        const SUPABASE_URL = 'https://hyimlsdqexkbltlhjctp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5aW1sc2RxZXhrYmx0bGhqY3RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ5MzU2MzYsImV4cCI6MjA3MDUxMTYzNn0.ALZNJUleYo4qzexjLCcoRRxg4xJDH6EW6KaHZHI-VmI';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Show message function
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = type;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }
        
        // Load users function with direct SQL query
        async function loadUsers() {
            const container = document.getElementById('users-table-container');
            
            try {
                // First check if user is logged in
                const { data: { session } } = await supabase.auth.getSession();
                
                if (!session) {
                    container.innerHTML = '<div class="error">You are not logged in. Please log in first.</div>';
                    return;
                }
                
                // Try to get users using normal query first
                try {
                    const { data: profiles, error } = await supabase
                        .from('profiles')
                        .select('*');
                    
                    if (error) throw error;
                    
                    displayUsers(profiles);
                    
                } catch (queryError) {
                    console.error('Error querying profiles:', queryError.message);
                    container.innerHTML = `
                        <div class="error">
                            <p>Error loading users: ${queryError.message}</p>
                            <p>This is likely due to RLS policies. Please run the SQL fix in bypass_rls.sql.</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Error:', error.message);
                container.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        // Display users
        function displayUsers(users) {
            const container = document.getElementById('users-table-container');
            
            if (!users || users.length === 0) {
                container.innerHTML = '<div class="error">No users found</div>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Admin</th>
                            <th>Subscription</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            users.forEach(user => {
                const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Unnamed User';
                const isAdmin = user.is_admin ? 'Yes' : 'No';
                const subscription = user.subscription_tier || 'free';
                const status = user.subscription_status || 'active';
                
                html += `
                    <tr>
                        <td>${user.id.substring(0, 8)}...</td>
                        <td>${fullName}</td>
                        <td>${isAdmin}</td>
                        <td>${subscription}</td>
                        <td><span class="status-badge status-${status}">${status}</span></td>
                        <td>
                            <button class="btn" onclick="makeAdmin('${user.id}')">Make Admin</button>
                            <button class="btn btn-danger" onclick="removeAdmin('${user.id}')">Remove Admin</button>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }
        
        // Make user admin
        async function makeAdmin(userId) {
            try {
                const { data, error } = await supabase
                    .from('profiles')
                    .update({ is_admin: true })
                    .eq('id', userId);
                
                if (error) throw error;
                
                showMessage(`User ${userId.substring(0, 8)}... is now an admin`, 'success');
                loadUsers(); // Reload users
                
            } catch (error) {
                console.error('Error making admin:', error.message);
                showMessage(`Error making admin: ${error.message}`, 'error');
            }
        }
        
        // Remove admin privileges
        async function removeAdmin(userId) {
            try {
                const { data, error } = await supabase
                    .from('profiles')
                    .update({ is_admin: false })
                    .eq('id', userId);
                
                if (error) throw error;
                
                showMessage(`Admin privileges removed from user ${userId.substring(0, 8)}...`, 'success');
                loadUsers(); // Reload users
                
            } catch (error) {
                console.error('Error removing admin:', error.message);
                showMessage(`Error removing admin: ${error.message}`, 'error');
            }
        }
        
        // Check database status
        async function checkDbStatus() {
            const statusContainer = document.getElementById('db-status');
            
            try {
                // Try a simple query to check if the database is accessible
                const { data, error } = await supabase
                    .from('profiles')
                    .select('count(*)', { count: 'exact', head: true });
                
                if (error) {
                    statusContainer.innerHTML = `
                        <div class="error">
                            <p><strong>Database Error:</strong> ${error.message}</p>
                            <p>This is likely due to RLS policies. Please run the SQL fix in bypass_rls.sql.</p>
                        </div>
                    `;
                    return;
                }
                
                statusContainer.innerHTML = `
                    <div class="success">
                        <p><strong>Database Status:</strong> Connected</p>
                        <p><strong>Row Level Security:</strong> Working correctly</p>
                    </div>
                `;
                
            } catch (error) {
                statusContainer.innerHTML = `
                    <div class="error">
                        <p><strong>Connection Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Add event listener for make admin button
        document.getElementById('make-admin-btn').addEventListener('click', function() {
            const userId = document.getElementById('user-id').value.trim();
            
            if (!userId) {
                showMessage('Please enter a user ID', 'error');
                return;
            }
            
            makeAdmin(userId);
        });
        
        // Make functions available globally
        window.makeAdmin = makeAdmin;
        window.removeAdmin = removeAdmin;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
            checkDbStatus();
        });
    </script>
</body>
</html>
